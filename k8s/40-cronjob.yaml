apiVersion: batch/v1
kind: CronJob
metadata:
  name: process-transactions
  namespace: transactions
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
          containers:
            - name: process
              image: transactions-pipeline:local
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/src/process.py"]
              workingDir: /db
              env:
                - name: S3_ENDPOINT_URL
                  value: http://s3:8333
                - name: S3_BUCKET
                  value: transactions
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: secret-key
              volumeMounts:
                - name: db
                  mountPath: /db
          volumes:
            - name: db
              persistentVolumeClaim:
                claimName: transaction-db
