apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-data
  namespace: transactions
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: transactions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs
          args: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
          ports:
            - name: s3
              containerPort: 8333
            - name: filer
              containerPort: 8888
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3-data
        - name: config
          secret:
            secretName: s3-credentials
            items:
              - key: s3.json
                path: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: transactions
spec:
  selector:
    app: s3
  ports:
    - name: s3
      port: 8333
    - name: filer
      port: 8888
