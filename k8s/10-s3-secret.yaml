apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: transactions
type: Opaque
stringData:
  access-key: local-access-key
  secret-key: local-secret-key
  s3.json: |
    {
      "identities": [
        {
          "name": "pipeline",
          "credentials": [
            {
              "accessKey": "local-access-key",
              "secretKey": "local-secret-key"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
