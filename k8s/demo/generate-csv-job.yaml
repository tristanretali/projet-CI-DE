apiVersion: batch/v1
kind: Job
metadata:
  name: generate-csv
  namespace: transactions
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: generate
          image: transactions-pipeline:local
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/src/generate_csv.py"]
          env:
            - name: S3_ENDPOINT_URL
              value: http://s3:8333
            - name: S3_BUCKET
              value: transactions
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
