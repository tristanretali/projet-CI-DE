services:
  s3:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs-data:/data
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  seaweedfs-data:
